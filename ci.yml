name: PHANTOM CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # ── Test ──────────────────────────────────────────────
  test:
    runs-on: ubuntu-latest
    name: Run Tests

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt pytest httpx

      - name: Run tests
        run: pytest tests/ -v --tb=short
        env:
          GITHUB_TOKEN: test-token
          PHANTOM_API_TOKEN: test-phantom-token
          MIZAN_PHANTOM_SIGNING_KEY: test-signing-key-that-is-at-least-32-chars
          PHANTOM_ALLOWED_TARGETS: https://example.com

  # ── Build Docker Image ────────────────────────────────
  build:
    runs-on: ubuntu-latest
    needs: test
    name: Build Docker Image (no publish)
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build --tag phantom:${{ github.sha }} .
