version: "3.9"

services:
  phantom:
    build: .
    container_name: phantom-api
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - .env
    environment:
      - HOST=127.0.0.1
      - PORT=8000
    volumes:
      - ./logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
